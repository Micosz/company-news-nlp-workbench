name: Workbench checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax
        run: python -m compileall -q server.py engine.py worker.py run_experiment.py algorithms scripts
      - name: JavaScript syntax
        run: node --check static/app.js
      - name: Integrity tests
        run: python -m unittest test_workbench -v
