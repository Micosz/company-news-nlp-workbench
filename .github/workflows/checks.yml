name: Workbench checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    defaults:
      run:
        working-directory: pair_workbench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pair_workbench/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax
        run: python -m compileall -q server.py engine.py worker.py run_experiment.py algorithms scripts
      - name: JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/charts.js
          node --check static/facts.js
      - name: Chart reporting integrity
        run: node --test test_charts.cjs test_facts.cjs
      - name: Integrity tests
        run: python -m unittest test_workbench test_nb test_cluster test_annotation test_provisional_roles test_temporal test_joint_features test_history -v

  xamr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xamr_lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: xamr_lab/requirements.txt
      - run: pip install -r requirements.txt httpx
      - run: python setup_data.py
      - run: python -m unittest test_engine test_cloud -v
      - run: node --check static/cloud.js
